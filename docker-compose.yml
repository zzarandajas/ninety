services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ninety}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sin puertos publicados al host: solo accesible entre contenedores.
    # Si necesitas conectarte con un cliente SQL desde tu máquina, usa
    # `docker compose exec postgres psql ...` en vez de exponer el puerto.

  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD}
    command: /bin/sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"
    restart: "no"
    # Contenedor de un solo uso: aplica migraciones pendientes y termina (exit 0).
    # `server` no arranca hasta que este contenedor termina con éxito.

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: 4000
    volumes:
      - uploads_data:/app/uploads
    # Sin puertos publicados al host: solo nginx habla con este contenedor.
    expose:
      - "4000"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - server
    # Sin puertos publicados al host: solo nginx habla con este contenedor.
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - server
      - front
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      # Añadir 443 + certificados (ver docs/MCP_SETUP.md hermano docs/DEPLOY.md)
      # cuando se configure HTTPS en el VPS.

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./scripts/backup-db.sh:/backup-db.sh:ro
      - backup_data:/backups
    # Bucle deliberadamente simple en vez de un cron real: la imagen oficial
    # de postgres no trae cron instalado y no queremos añadir un paquete
    # nuevo solo para esto. Hace el primer backup inmediatamente al arrancar
    # el contenedor (no espera a medianoche) y luego uno cada 24h.
    entrypoint: ["/bin/sh", "-c", "while true; do sh /backup-db.sh; sleep 86400; done"]

volumes:
  postgres_data:
  uploads_data:
  backup_data:
