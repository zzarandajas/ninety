# Mapea el header Upgrade entrante al valor correcto de Connection:
#   - petición WebSocket (Upgrade: websocket) → Connection: upgrade
#   - petición HTTP normal (sin Upgrade)      → Connection: close
# Sin esto habría que elegir uno de los dos y romper el otro caso.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Todo lo que empiece por /api/ va al backend (Fastify).
    # Se reescribe quitando el prefijo /api antes de reenviar, así el
    # servidor Fastify no necesita saber nada sobre este prefijo.
    location /api/ {
        proxy_pass http://server:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Necesario si en algún sprint se añade WebSocket (ej. notificaciones live
        # durante una L10 meeting). En peticiones HTTP normales se resuelve a "close".
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Todo lo demás va al frontend (build estático servido por su propio nginx interno
    # en producción; el dev server de Vite en docker-compose.dev.yml).
    location / {
        proxy_pass http://front:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El HMR de Vite abre un WebSocket contra este mismo origen en desarrollo.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
